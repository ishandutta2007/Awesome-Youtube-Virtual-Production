<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="40%" stop-color="#0d1224" />
      <stop offset="75%" stop-color="#111836" />
      <stop offset="100%" stop-color="#080b18" />
    </linearGradient>

    <!-- Animated Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#9d4edd;#ff2a85;#00f2fe" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="45%" stop-color="#4facfe">
        <animate attributeName="stop-color" values="#4facfe;#00f2fe;#c77dff;#4facfe" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ff3366">
        <animate attributeName="stop-color" values="#ff3366;#ffd166;#00f2fe;#ff3366" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Studio Floor Grid Pattern -->
    <pattern id="studioGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#25355a" stroke-width="0.8" stroke-opacity="0.35" />
    </pattern>

    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8" />
    </linearGradient>

    <mask id="gridMask">
      <rect x="0" y="160" width="1280" height="220" fill="url(#gridFade)" />
    </mask>

    <style>
      .glow-pulse {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .laser-scan {
        animation: scan 6s linear infinite;
      }
      .camera-frustum {
        animation: frustumRotate 10s ease-in-out infinite alternate;
        transform-origin: 1000px 100px;
      }
      .pill-float-1 {
        animation: float1 5s ease-in-out infinite;
      }
      .pill-float-2 {
        animation: float2 6s ease-in-out infinite;
      }
      .pill-float-3 {
        animation: float1 5.5s ease-in-out infinite 1s;
      }
      .pill-float-4 {
        animation: float2 6.5s ease-in-out infinite 0.5s;
      }
      @keyframes pulse {
        0% { opacity: 0.35; transform: scale(0.98); }
        100% { opacity: 0.75; transform: scale(1.02); }
      }
      @keyframes scan {
        0% { transform: translateY(0px); opacity: 0; }
        30% { opacity: 0.8; }
        70% { opacity: 0.8; }
        100% { transform: translateY(220px); opacity: 0; }
      }
      @keyframes frustumRotate {
        0% { transform: rotate(-5deg); }
        100% { transform: rotate(8deg); }
      }
      @keyframes float1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(5px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="380" rx="16" fill="url(#bgGradient)" />

  <!-- Studio Stage Volumetric Spotlights -->
  <g opacity="0.3" class="glow-pulse">
    <!-- Left Spotlight Cone (Cyan) -->
    <polygon points="120,0 0,380 400,380" fill="url(#titleGrad)" opacity="0.15" />
    <!-- Right Spotlight Cone (Magenta/Violet) -->
    <polygon points="1160,0 900,380 1280,380" fill="#9d4edd" opacity="0.15" />
    <!-- Center Top Key Light -->
    <circle cx="640" cy="-40" r="280" fill="#00f2fe" filter="url(#softGlow)" opacity="0.12" />
    <circle cx="200" cy="80" r="150" fill="#ff007f" filter="url(#softGlow)" opacity="0.08" />
  </g>

  <!-- Perspective Perspective Floor Grid (Simulating LED Volume Stage) -->
  <g mask="url(#gridMask)">
    <rect x="0" y="180" width="1280" height="200" fill="url(#studioGrid)" />
    <!-- Virtual Stage Ring Horizon Line -->
    <ellipse cx="640" cy="380" rx="600" ry="120" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.4" filter="url(#neonGlow)" />
    <ellipse cx="640" cy="380" rx="420" ry="80" fill="none" stroke="#7928ca" stroke-width="1" stroke-opacity="0.5" />
  </g>

  <!-- Dynamic Scanline Sweep across LED Horizon -->
  <line x1="100" y1="200" x2="1180" y2="200" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.3" class="laser-scan" filter="url(#neonGlow)" />

  <!-- Camera Tracking Crosshairs / Frustum in Background (Subtle) -->
  <g class="camera-frustum" opacity="0.25">
    <circle cx="1080" cy="90" r="32" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-dasharray="4,4" />
    <circle cx="1080" cy="90" r="16" fill="none" stroke="#00f2fe" stroke-width="1" />
    <line x1="1040" y1="90" x2="1120" y2="90" stroke="#00f2fe" stroke-width="1.2" />
    <line x1="1080" y1="50" x2="1080" y2="130" stroke="#00f2fe" stroke-width="1.2" />
    <path d="M 1080 90 L 1220 180 M 1080 90 L 1020 200" stroke="#00f2fe" stroke-width="0.8" stroke-dasharray="2,3" />
  </g>

  <g opacity="0.2">
    <!-- Left Camera Sensor Glyph -->
    <rect x="70" y="75" width="45" height="30" rx="4" fill="none" stroke="#ff007f" stroke-width="1.2" />
    <polygon points="115,83 130,73 130,107 115,97" fill="none" stroke="#ff007f" stroke-width="1.2" />
    <circle cx="92" cy="90" r="6" fill="#ff007f" />
  </g>

  <!-- Ambient Stage Floating Particles -->
  <circle cx="280" cy="110" r="2" fill="#00f2fe" opacity="0.6">
    <animate attributeName="cy" values="110;95;110" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="980" cy="130" r="2.5" fill="#ff007f" opacity="0.5">
    <animate attributeName="cy" values="130;145;130" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="450" cy="65" r="1.5" fill="#ffd166" opacity="0.7">
    <animate attributeName="cy" values="65;55;65" dur="3.5s" repeatCount="indefinite" />
  </circle>

  <!-- FOREGROUND CONTENT: Header Category Badge -->
  <g transform="translate(640, 68)" text-anchor="middle">
    <rect x="-185" y="-16" width="370" height="32" rx="16" fill="#161f38" stroke="#2e4272" stroke-width="1.2" opacity="0.9" />
    <circle cx="-160" cy="0" r="5" fill="#00f2fe" filter="url(#neonGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="5" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#00f2fe" letter-spacing="1.8">VIRTUAL CINEMATOGRAPHY &amp; ICVFX</text>
  </g>

  <!-- Main Title -->
  <text x="640" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="2" filter="url(#softGlow)" opacity="0.25">AWESOME YOUTUBE VIRTUAL PRODUCTION</text>
  <text x="640" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="2">AWESOME YOUTUBE VIRTUAL PRODUCTION</text>

  <!-- Subtitle -->
  <text x="640" y="194" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1" letter-spacing="0.8">
    Curated SaaS Platforms, Real-Time Game Engines, Camera Tracking &amp; Open-Source Tools
  </text>

  <!-- Modern Floating Technology Feature Pills (Positioned safely below subtitle) -->
  <g transform="translate(640, 260)">
    <!-- Pill 1: Unreal Engine & LED Volumes -->
    <g class="pill-float-1" transform="translate(-460, 0)">
      <rect x="-10" y="-15" width="205" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="12" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#38bdf8">🎮 Unreal Engine &amp; LED</text>
    </g>

    <!-- Pill 2: In-Camera VFX -->
    <g class="pill-float-2" transform="translate(-230, 0)">
      <rect x="-10" y="-15" width="185" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="12" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#a855f7">🎥 In-Camera VFX (ICVFX)</text>
    </g>

    <!-- Pill 3: Camera Tracking -->
    <g class="pill-float-3" transform="translate(-20, 0)">
      <rect x="-10" y="-15" width="195" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="12" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#f43f5e">📡 OpenTrackIO &amp; Free-D</text>
    </g>

    <!-- Pill 4: Chroma Key & NDI -->
    <g class="pill-float-4" transform="translate(200, 0)">
      <rect x="-10" y="-15" width="180" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="12" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#10b981">🟢 Chroma Key &amp; NDI</text>
    </g>

    <!-- Pill 5: AI Previs & Virtual Studio -->
    <g class="pill-float-1" transform="translate(405, 0)">
      <rect x="-10" y="-15" width="175" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="12" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#fbbf24">🎬 AI Previs &amp; Studio</text>
    </g>
  </g>

  <!-- Bottom Accent Status Bar -->
  <g transform="translate(640, 335)" text-anchor="middle">
    <rect x="-240" y="-14" width="480" height="28" rx="14" fill="#0a0f1d" stroke="#1e293b" stroke-width="1" />
    <circle cx="-210" cy="0" r="4" fill="#22c55e">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="10" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8">
      BUILT FOR INDIE FILMMAKERS, YOUTUBERS &amp; REAL-TIME CREATORS
    </text>
  </g>
</svg>
